# ===========================================================================
# 本次專案設定 —— 開跑前先把 book / presenter 兩區填好
# 其餘欄位為規劃書 §3 的既定值，非必要不要動
# ===========================================================================

book:
  title_zh: "時間的代價"
  title_en: "The Price of Time: The Real Story of Interest"
  author: "Edward Chancellor"
  publisher_year: "今周刊 2024（原著 Allen Lane 2022）"

presenter:
  name: "Josh Chan"
  dept: "復華投信"
  date: "2026/XX/XX"

deck:
  minutes: 60
  target_slides:                   # 頁數參考區間；留空就依 minutes 推算（約 0.85 頁/分鐘）。
                                   # 只用來 WARN，不會裁頁——品質優先於頁數（見 CLAUDE.md）
  language: "zh-TW"
  terminology: "中文為主，專有名詞保留英文原文並於首次出現加註"

  # 內頁色系：母片三組內頁的頁首色帶不同，挑一組當主力版型
  #   1 = 內頁1 / 1-1   復華紅
  #   2 = 內頁2 / 2-1   米白
  #   3 = 內頁3 / 3-1   灰
  layout_family: 2

  # 主線的最後一頁（走母片「結尾」版面，自帶復華抬頭與電話）。
  # 附錄排在它後面，被問到再翻。留空就不放這一頁。
  closing_wish: "業績長紅"

  # 文案語氣：professional_warm | professional | casual | storytelling
  # （內容見下方 tone_presets；預設 professional_warm：依據要站得住，但句子要像人講的）
  tone: professional_warm

# --- 分享會現場要播的影片 -------------------------------------------------
# 每一支會生成一張專用影片頁（標題 + QR code + 起訖時間碼），
# 播放秒數計入總時長，逐字稿只寫進場與收尾的過場詞。
# start / end 用 mm:ss 或 hh:mm:ss。留空陣列代表不播影片。
videos: []
# videos:
#   - title: "作者 TED 演講：為什麼配置勝過選股"
#     url: "https://www.youtube.com/watch?v=XXXXXXXXXXX"
#     start: "02:15"
#     end: "05:40"
#     after_ch: ch03          # 放在哪一章之後；留空就放在全書綜合之前
#     note: "播到他講 LTCM 那段就可以停"

# --- 文案語氣預設 ---------------------------------------------------------
# 這段文字會被 05_outline.py 帶進 deck.json 的 meta.tone_directive，
# 潤飾與逐字稿階段照著寫。要自訂語氣直接改這裡的文字。
tone_presets:
  professional_warm:
    label: "專業但親切"
    audience: "對同事分享，聽眾會追問依據，但不想聽人唸稿"
    slide: |
      定位：資料一樣要站得住，但句子要像人講出來的，不是名詞堆出來的。
      主標寫成一句話，有主詞有動詞，唸得出來。
        ✗ 利率與投機的關係
        ✗ 廉價資金：弱者的代價
        ✓ 利率掉到 2%，英國人就會去做傻投資
      內文每一條都要對得到一個出處或數字，但不要寫成「名詞：名詞」。
        ✗ 監理套利：和法律同齡
        ✓ 漢摩拉比訂了上限卻沒訂期間，套利和法律一樣老
      一頁最多一個英文原詞（作者自己造的關鍵詞才留原文），其餘用中文講。
      三條要點不要長得一模一樣：長度、句式、結尾都要有變化。
      可以用「其實」「反過來說」「講白一點」這種轉折詞。
      不要：驚嘆號、口號式排比、沒有依據的判斷、以「我覺得」開頭的主觀句。
    narration: |
      像在跟同事講話：句子講完整，但可以有轉折詞、可以停頓、可以反問。
      引用資料時把出處唸出來：「根據主計總處二〇二四年的家庭收支調查」。
      要表達判斷可以說「我自己的看法是」，但下一句一定要接根據什麼。
      數字唸清楚單位與時間點，百分點與百分比要分清楚。
      專有名詞第一次出現唸全稱，並補一句白話解釋。
      每一章結束前用一句話把聽眾拉回來：「所以這一章要講的是⋯⋯」。
      被問到書裡沒寫的，直接說「這本書沒處理，我另外查到的是」，不要含糊帶過。

  professional:
    label: "專業嚴謹"
    audience: "對主管、風控與跨部門同事報告，聽眾會追問依據"
    slide: |
      定位：每個判斷都要站得住，聽眾隨時可能追問「這數字哪來的」。
      主標寫成可被驗證的結論句，帶限定條件，不要絕對化。
        ✗ 選股沒有用
        ✓ 扣除成本後，主動選股的超額報酬接近於零
      內文每一條都要能對應到一個出處或數字；沒有依據的判斷不要寫上投影片。
      專有名詞用全稱，首次出現寫「中文（English）」。
      不要：口語轉折詞（其實／說白了／講白一點）、驚嘆號、反問句、
      以「我覺得」開頭的主觀句。
    narration: |
      語速穩，句子講完整，不要吞尾音。
      引用資料時把出處唸出來：「根據主計總處二〇二四年的家庭收支調查」。
      表達判斷用「從資料上看」「這組數字支持的推論是」，不要用「我覺得」「我猜」。
      數字要唸清楚單位與時間點，百分點與百分比要分清楚。
      專有名詞第一次出現唸全稱，並補一句白話解釋。
      被問到書裡沒寫的，直接說「這本書沒處理，我另外查到的是」，不要含糊帶過。

  casual:
    label: "輕鬆口語"
    audience: "對熟悉的同事分享，現場可以互動、可以被打斷"
    slide: |
      定位：像在茶水間跟同事講一本剛看完的書，但該有的數字一個都不少。
      主標可以帶立場與情緒，用短句。
        ✗ 再平衡機制的執行障礙
        ✓ 再平衡最難的不是計算，是按下賣出
      內文可以用轉折詞、可以斷句，但每頁仍然要有一個具體物
      （數字、年份、案例名）。
      不要：為了輕鬆而犧牲依據、沒有出處的「聽說」「大家都知道」、
      網路流行語（比正經話更快過時）。
    narration: |
      口語。可以用「這邊」「其實」「我自己的經驗是」「講白一點」。
      可以自嘲、可以承認「我第一次看這段也沒看懂」。
      可以停頓、可以反問聽眾（「你們猜這個數字是多少」）。
      但數字段落要收斂回正經：唸到數據時放慢，把單位與年份講清楚，
      講完再回到輕鬆的語氣。
      預期會被打斷，段落之間適合留一句「這邊有沒有問題」。

  storytelling:
    label: "說故事"
    audience: "希望聽眾三個月後還記得，願意用時間換記憶點"
    slide: |
      定位：每一章用一個具體的人或事件當入口，結論長在故事後面。
      主標寫成有畫面的句子，不要用抽象名詞當標題。
        ✗ 流動性風險的定義
        ✓ 那天他想賣，但市場上沒有人要買
      數字綁在故事裡（「那一年他賠掉四成」），不要裸露的統計數字。
      每頁最多一個故事，講完就收，不要連著鋪陳兩頁。
      不要：為了戲劇性扭曲事實、虛構書中沒有的細節、
      故事講完卻忘了收到結論。
    narration: |
      結構固定：場景 → 轉折 → 結論。先讓聽眾看見畫面，再給道理。
      開頭用具體的時間地點人物把人拉進來
      （「二〇〇八年九月十五號早上，他打開交割單」）。
      中段揭示意外之處，用「你猜後來怎麼樣」「結果不是這樣」推進。
      結尾一定要收回這一頁的結論，不要只留故事。
      故事來源必須是書裡或查得到的真實案例，不要自己編人物或情節——
      真實案例才禁得起追問。

research:
  taiwan_lens: true                # 每章至少 1 筆台灣對照資料（進證據頁或附錄，不強制成頁）
  min_sources_per_chapter: 2
  max_source_age_years: 3          # 超過 3 年的數據要標註「截至 XXXX 年」

# --- 以下為文案與品管的硬性門檻（規劃書 §7.3 / §8.4 / §10）-----------------
limits:
  # 主標／副標的上限是量出來的，不是規格書上的數字：
  # 內頁1-1 主標框 36pt 單行、寬 6,840,760 EMU，約放得下 14 個全形字，
  # 超過會折成兩行壓到副標上；副標 24pt 同理約 21 字。
  title_max_chars: 14
  subtitle_max_chars: 21
  # 視覺頁走版面 9，標題是自建 textbox（32pt / 18pt，寬 8,208,144 EMU），
  # 比內頁的 placeholder 寬，所以另設一組上限。
  chart_title_max_chars: 20
  chart_subtitle_max_chars: 30
  bullet_l1_max_chars: 40          # 第一層要點 ≤ 40 字
  bullet_l2_max_chars: 60          # 第二層補充 ≤ 60 字
  body_max_chars_per_slide: 160    # 每頁內文總字數 ≤ 160 字
  bullets_l1_range: [2, 3]         # 每頁第一層要點 2–3 條（原本 3–5，實跑後發現
                                   # 4–5 條會讓整份簡報變成一頁接一頁的條列）

  # --- 條列頁只准三種樣式（prompts/outline.md），裸條列 08_qa 判 FAIL -----
  body_styles: [chain, labeled, prose]
  label_max_chars: 5               # labeled：標籤 ≤5 字（「機制」「證據」「台灣」「今天」）
  chain_steps_range: [2, 4]        # chain：2–4 步，3 步最好
  prose_paragraphs_max: 2          # prose：最多兩段
  prose_paragraph_max_chars: 90    # prose：每段 ≤90 字

  # --- 以下三條是「不要變成純條列簡報」的防線 ---------------------------
  # 一份好的讀書分享，條列頁應該是少數。實跑 84 頁時有 45 頁（54%）是
  # 長得一模一樣的條列頁，每頁都沒超字數上限，但整份看起來就是很悶。
  max_consecutive_bullet_slides: 2   # 最多連續 2 頁條列，第 3 頁必須是視覺頁
  visual_slide_ratio_min: 0.40       # 視覺頁（圖／圖形／引言／大數字）至少佔四成
  max_outline_level: 0             # 三種樣式都不用第二層；level 只給封面等固定頁用
  max_body_lines: 8                # 24pt 中文估算最多 8 行，超過就降級／拆頁
  font_downgrade_pt: 20            # 第一段降級字級
  font_floor_pt: 16                # 絕不允許縮到 16pt 以下

# --- 節奏指引（只 WARN 不 FAIL：時間是指引，品質才是門檻）--------------------
pacing:
  divider_max_sec: 20              # 主張頁籤只講一句話
  quote_stat_max_sec: 30           # 引言頁／大數字頁是節奏工具，不停留
  page_max_sec: 120                # 單頁超過 2 分鐘就該拆頁（影片頁除外）
  prologue_share_max: 0.15         # 序幕（第一幕頁籤之前）不超過總時長 15%

narration:
  chars_per_minute: 220            # 中文語速基準
  total_minutes_range:             # null = 依 deck.minutes 推算（總長 − 5 分鐘 Q&A）
  tolerance: 0.25                  # 每頁字數 = duration_sec × 220/60 ±25%

# 對岸用語黑名單（規劃書 §10 / §7.3）
banned_terms:
- 賦能
- 抓手
- 閉環
- 顆粒度
- 打法
- 復盤
- 落地性
- 對標
- 底層邏輯
- 心智模型化
- 強力度
- 顆粒
- 鏈路
- 生態位
- 護城河化
- 用戶                              # 台灣慣用「使用者／客戶」
- 信息                              # 台灣慣用「資訊」
- 質量                              # 台灣慣用「品質」
- 數據化運營
- 視頻
- 軟件
- 硬件
- 網絡                              # 台灣慣用「網路」
